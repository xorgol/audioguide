<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-MUSE | Professional Annotation Editor</title>
    <link rel="stylesheet" href="shinkwasa.css">
    <style>
        :root { --primary: #954747; --bg: #f5f5f5; --panel: #ffffff; --text: #333; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

        #preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 2px solid #ddd; background: #000; }
        #viewport-container { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: crosshair; touch-action: none; }
        #artwork-stage { position: relative; width: 100%; height: 100%; }
        .artwork-layer, #annotation-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: fill; transform-origin: center; pointer-events: none; }
        #artwork-image-bg { z-index: 10; transition: transform 0.1s linear, filter 0.3s ease; }
        #artwork-image-fg { z-index: 20; transition: transform 0.1s linear, clip-path 0.1s linear; }
        #annotation-layer { z-index: 30; }

        #player-container { flex: 0 0 auto; background: #fff; padding: 8px 10px; }
        #control-pane { width: 450px; max-width: 100%; background: var(--panel); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); }
        .section { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.75rem; }
        input, select { width: 100%; padding: 6px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; }
        
        .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .control-row label { flex: 0 0 80px; margin-bottom: 0; }
        .control-row input { margin-bottom: 0; }

        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }

        button { padding: 8px 10px; min-height: 36px; border: none; border-radius: 4px; background: #666; color: white; cursor: pointer; font-weight: bold; font-size: 0.8rem; touch-action: manipulation; }
        button.primary { background: var(--primary); width: 100%; margin-top: 5px; }
        button:hover { opacity: 0.9; }

        .keyframe-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: white; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; cursor: pointer; }
        .keyframe-item.selected { border-color: var(--primary); background: #fff0f0; }
        .kf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; }
        .kf-grid div { display: flex; flex-direction: column; }
        .kf-grid label { font-size: 0.6rem; margin: 0; color: #888; text-transform: uppercase; }
        .kf-grid input, .kf-grid select { margin: 0; padding: 4px 6px; font-size: 0.75rem; width: 100%; }

        .hint { font-size: 0.75rem; color: #666; font-style: italic; margin-bottom: 8px; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            #preview-pane { flex: 0 0 46vh; flex: 0 0 46dvh; border-right: none; border-bottom: 2px solid #ddd; }
            #player-container { padding: 4px 6px; }
            #control-pane { width: 100%; flex: 1 1 auto; min-height: 0; padding: 12px; }
            input, select { font-size: 16px; min-height: 36px; }
            .kf-grid input, .kf-grid select { font-size: 14px; min-height: 32px; }
            button { min-height: 42px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div id="preview-pane">
        <div id="viewport-container">
            <div id="artwork-stage">
                <img id="artwork-image-bg" class="artwork-layer" src="carmignano.png">
                <img id="artwork-image-fg" class="artwork-layer" src="carmignano.png">
                <svg id="annotation-layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
            </div>
        </div>
        <div id="player-container"><div id="player"></div></div>
    </div>

    <div id="control-pane">
        <h2>Professional Editor</h2>

        <div class="section">
            <p class="hint">Shortcut: <b>Ctrl+Z</b> Undo vertex. <b>Tap/Click</b> Art to set focus/add point.</p>
            <label>Marker Type</label>
            <select id="prop-type">
                <option value="circle">Circle (Pulse)</option>
                <option value="pointer">Pointer (Minimal)</option>
                <option value="polygon">Polygon (Area)</option>
                <option value="none">Zoom Only</option>
            </select>

            <label>Exterior Effect</label>
            <select id="prop-effect">
                <option value="none">None</option>
                <option value="blur">Blur</option>
                <option value="grayscale">Grayscale</option>
            </select>

            <div class="control-row">
                <label>Color & Alpha</label>
                <input type="color" id="prop-color" value="#ffd700">
                <input type="range" id="prop-alpha" min="0" max="1" step="0.1" value="1">
            </div>

            <div class="control-row">
                <label>Thickness</label>
                <input type="number" id="prop-thickness" value="2" min="0" max="20" step="0.5">
            </div>

            <div class="control-row">
                <label>Vertex Size</label>
                <input type="number" id="prop-vsize" value="1.5" min="0.1" max="10" step="0.1">
            </div>
            
            <div class="btn-row">
                <button id="undo-point" style="background:#777; font-size:0.75rem;">Undo Last Point</button>
                <button id="clear-points" style="background:#888; font-size:0.75rem;">Clear Points</button>
            </div>
        </div>

        <div class="section">
            <h3>Keyframes</h3>
            <div id="keyframe-list"></div>
            <button class="primary" id="add-keyframe">+ Add Keyframe</button>
        </div>

        <div class="btn-row" style="margin-top: auto">
            <button id="load-default-json" style="background:#555">Load Default</button>
            <button id="import-json" style="background:#555">Import JSON</button>
            <button id="export-json" class="primary" style="background:#333; margin-top: 0">Export JSON</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none">
    </div>

    <script type="module">
        import { Player } from "./shinkwasa.js";

        let activeKeyframes = [];
        let selectedIdx = -1;
        let isDragging = false;
        let draggingPointIdx = -1;

        const bg = document.getElementById('artwork-image-bg'), fg = document.getElementById('artwork-image-fg'), svg = document.getElementById('annotation-layer'), list = document.getElementById('keyframe-list'), viewport = document.getElementById('viewport-container'), stage = document.getElementById('artwork-stage');
        let stageAspect = 1;

        function fitStage() {
            const cw = viewport.clientWidth, ch = viewport.clientHeight;
            const natW = bg.naturalWidth, natH = bg.naturalHeight;
            if (!cw || !ch || !natW || !natH) return;
            const scale = Math.min(cw / natW, ch / natH);
            const fw = natW * scale, fh = natH * scale;
            stage.style.width = `${fw}px`;
            stage.style.height = `${fh}px`;
            stageAspect = fw / fh;
        }
        new ResizeObserver(fitStage).observe(viewport);
        bg.addEventListener('load', fitStage);
        fitStage();
        const propUI = { type: document.getElementById('prop-type'), effect: document.getElementById('prop-effect'), color: document.getElementById('prop-color'), alpha: document.getElementById('prop-alpha'), thickness: document.getElementById('prop-thickness'), vSize: document.getElementById('prop-vsize') };

        const player = new Player({ container: () => document.querySelector("#player"), audio: { src: "demo.mp3" } });
        window.player = player;

        // Sync Prop UI -> State
        Object.keys(propUI).forEach(k => {
            const ev = (k==='color'||k==='alpha') ? 'input' : 'change';
            propUI[k].addEventListener(ev, () => {
                if (selectedIdx === -1) return;
                const val = (propUI[k].type === 'number' || propUI[k].type === 'range') ? parseFloat(propUI[k].value) : propUI[k].value;
                activeKeyframes[selectedIdx][k] = val;
                render();
            });
        });

        function getLocalCoords(e) {
            const rect = stage.getBoundingClientRect();
            return {
                x: parseFloat(Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)).toFixed(1)),
                y: parseFloat(Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100)).toFixed(1))
            };
        }

        viewport.onpointerdown = (e) => {
            if (selectedIdx === -1) return;
            isDragging = true;
            const loc = getLocalCoords(e), kf = activeKeyframes[selectedIdx];
            const hitRadius = e.pointerType === 'touch' ? 6 : 3;
            if (kf.type === 'polygon') {
                if (!kf.points) kf.points = [];
                draggingPointIdx = kf.points.findIndex(p => Math.abs(p.x - loc.x) < hitRadius && Math.abs(p.y - loc.y) < hitRadius);
                if (draggingPointIdx === -1) { kf.points.push(loc); draggingPointIdx = kf.points.length - 1; }
            } else { kf.x = loc.x; kf.y = loc.y; }
            render(); viewport.setPointerCapture(e.pointerId);
        };
        window.onpointermove = (e) => {
            if (!isDragging || selectedIdx === -1) return;
            const loc = getLocalCoords(e), kf = activeKeyframes[selectedIdx];
            if (kf.type === 'polygon' && draggingPointIdx >= 0) kf.points[draggingPointIdx] = loc;
            else { kf.x = loc.x; kf.y = loc.y; }
            render();
        };
        const stopDragging = () => { isDragging = false; draggingPointIdx = -1; };
        window.onpointerup = stopDragging;
        window.onpointercancel = stopDragging;

        document.getElementById('add-keyframe').onclick = () => {
            const kf = { time: parseFloat(player.currentTime.toFixed(2)), x: 50, y: 50, zoom: 1.0, type: propUI.type.value, effect: propUI.effect.value, color: propUI.color.value, alpha: parseFloat(propUI.alpha.value), thickness: parseFloat(propUI.thickness.value), vSize: parseFloat(propUI.vSize.value), easing: 'linear', points: [] };
            activeKeyframes.push(kf); activeKeyframes.sort((a,b)=>a.time-b.time); selectedIdx = activeKeyframes.indexOf(kf); render();
        };

        document.getElementById('undo-point').onclick = () => { if (selectedIdx !== -1 && activeKeyframes[selectedIdx].points && activeKeyframes[selectedIdx].points.length > 0) { activeKeyframes[selectedIdx].points.pop(); render(); } };
        document.getElementById('clear-points').onclick = () => { if (selectedIdx !== -1) { activeKeyframes[selectedIdx].points = []; render(); } };

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && selectedIdx !== -1 && activeKeyframes[selectedIdx].points.length > 0) {
                activeKeyframes[selectedIdx].points.pop(); render();
            }
        });

        function drawAnnotation(s, showHandles) {
            svg.innerHTML = '';
            if (!s) {
                bg.style.filter = 'none'; fg.style.clipPath = 'none';
                bg.style.transform = fg.style.transform = svg.style.transform = 'scale(1) translate(0,0)';
                return;
            }
            const hex = s.color || '#ffd700';
            const alpha = s.alpha ?? 1;
            const col = `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${alpha})`;
            const mx = (50 - s.x) * s.zoom, my = (50 - s.y) * s.zoom;
            bg.style.transform = fg.style.transform = svg.style.transform = `scale(${s.zoom}) translate(${mx}%, ${my}%)`;
            bg.style.filter = s.effect === 'blur' ? 'blur(8px) brightness(0.8)' : s.effect === 'grayscale' ? 'grayscale(1) opacity(0.7)' : 'none';

            if (s.type === 'polygon' && s.points && s.points.length > 2) fg.style.clipPath = `polygon(${s.points.map(p=>`${p.x}% ${p.y}%`).join(', ')})`;
            else if (s.type === 'circle') fg.style.clipPath = `circle(10% at ${s.x}% ${s.y}%)`;
            else fg.style.clipPath = 'none';

            if ((s.thickness ?? 2) > 0) {
                if (s.type === 'circle') {
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
                    c.setAttribute("cx", s.x); c.setAttribute("cy", s.y);
                    c.setAttribute("rx", (5 / Math.sqrt(stageAspect)).toFixed(2));
                    c.setAttribute("ry", (5 * Math.sqrt(stageAspect)).toFixed(2));
                    c.setAttribute("fill", "none"); c.setAttribute("stroke", col); c.setAttribute("stroke-width", s.thickness);
                    c.setAttribute("vector-effect", "non-scaling-stroke");
                    svg.appendChild(c);
                } else if (s.type === 'pointer') {
                    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    l.setAttribute("x1", s.x + 3); l.setAttribute("y1", s.y + 3); l.setAttribute("x2", s.x); l.setAttribute("y2", s.y);
                    l.setAttribute("stroke", col); l.setAttribute("stroke-width", s.thickness);
                    l.setAttribute("vector-effect", "non-scaling-stroke");
                    svg.appendChild(l);
                } else if (s.type === 'polygon' && s.points) {
                    const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    p.setAttribute("points", s.points.map(pt=>`${pt.x},${pt.y}`).join(' '));
                    p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", s.thickness);
                    p.setAttribute("vector-effect", "non-scaling-stroke");
                    svg.appendChild(p);
                }
            }
            if (showHandles && s.type === 'polygon' && s.points) {
                s.points.forEach(pt => {
                    const h = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
                    h.setAttribute("cx", pt.x); h.setAttribute("cy", pt.y);
                    h.setAttribute("rx", ((s.vSize ?? 1.5) / Math.sqrt(stageAspect)).toFixed(2));
                    h.setAttribute("ry", ((s.vSize ?? 1.5) * Math.sqrt(stageAspect)).toFixed(2));
                    h.setAttribute("fill", col); svg.appendChild(h);
                });
            }
        }

        function render() {
            // Sidebar
            list.innerHTML = '';
            activeKeyframes.forEach((kf, i) => {
                const item = document.createElement('div');
                item.className = `keyframe-item ${i === selectedIdx ? 'selected' : ''}`;
                item.onclick = (e) => { if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName)) return; selectedIdx = i; Object.keys(propUI).forEach(k=>propUI[k].value=kf[k]); render(); };
                
                const grid = document.createElement('div'); grid.className = 'kf-grid';
                grid.innerHTML = `
                    <div><label>Time</label><input type="number" step="0.1" value="${kf.time}"></div>
                    <div><label>Zoom</label><input type="number" step="0.1" value="${kf.zoom}"></div>
                    <div><label>Ease</label><select><option value="linear" ${kf.easing==='linear'?'selected':''}>Lin</option><option value="ease-in" ${kf.easing==='ease-in'?'selected':''}>In</option><option value="ease-out" ${kf.easing==='ease-out'?'selected':''}>Out</option></select></div>
                    <div><label>X%</label><input type="number" step="1" value="${kf.x}"></div>
                    <div><label>Y%</label><input type="number" step="1" value="${kf.y}"></div>
                    <div><label>Type</label><span style="font-size:0.55rem; color:var(--primary); font-weight:bold">${kf.type}</span></div>
                `;
                const inps = grid.querySelectorAll('input, select');
                inps[0].onchange=(e)=>{ kf.time=parseFloat(e.target.value); activeKeyframes.sort((a,b)=>a.time-b.time); selectedIdx=activeKeyframes.indexOf(kf); render(); };
                inps[1].onchange=(e)=>{ kf.zoom=parseFloat(e.target.value); render(); };
                inps[2].onchange=(e)=>{ kf.easing=e.target.value; render(); };
                inps[3].onchange=(e)=>{ kf.x=parseFloat(e.target.value); render(); };
                inps[4].onchange=(e)=>{ kf.y=parseFloat(e.target.value); render(); };

                const del = document.createElement('button'); del.textContent = '×'; del.style.cssText = 'background:#ff4747; color:white; min-width:34px; min-height:34px; padding:0; flex:none';
                del.onclick = (e) => { e.stopPropagation(); activeKeyframes.splice(i,1); selectedIdx=-1; render(); };
                item.appendChild(grid); item.appendChild(del); list.appendChild(item);
            });

            // Canvas
            drawAnnotation(selectedIdx === -1 ? null : activeKeyframes[selectedIdx], true);
        }

        const lerp = (a, b, t) => a + (b - a) * t;
        const ease = (t, type) => (type === 'ease-in') ? t*t : (type === 'ease-out') ? t*(2-t) : t;
        setInterval(() => {
            if (player.audio && !player.audio.paused && activeKeyframes.length > 1 && !isDragging) {
                const t = player.currentTime;
                let k1 = null, k2 = null;
                for(let i=0; i<activeKeyframes.length-1; i++) {
                    if (t >= activeKeyframes[i].time && t <= activeKeyframes[i+1].time) { k1 = activeKeyframes[i]; k2 = activeKeyframes[i+1]; break; }
                }
                if (k1 && k2) {
                    const duration = k2.time - k1.time;
                    const alpha = duration > 0 ? ease((t - k1.time) / duration, k1.easing) : 1;
                    const state = {
                        type: k1.type, color: k1.color, alpha: k1.alpha, thickness: k1.thickness, effect: k1.effect, vSize: k1.vSize,
                        x: lerp(k1.x, k2.x, alpha), y: lerp(k1.y, k2.y, alpha), zoom: lerp(k1.zoom, k2.zoom, alpha),
                        points: (k1.type === 'polygon' && k1.points && k2.points && k1.points.length === k2.points.length)
                            ? k1.points.map((p, idx) => ({ x: lerp(p.x, k2.points[idx].x, alpha), y: lerp(p.y, k2.points[idx].y, alpha) }))
                            : k1.points
                    };
                    drawAnnotation(state, false);
                } else {
                    drawAnnotation(null, false);
                }
            }
        }, 33);

        function loadAnnotationsData(data) {
            const raw = Array.isArray(data) && data.length > 0 && data[0].keyframes ? data[0].keyframes : Array.isArray(data) ? data : [];
            activeKeyframes = raw.map(k => ({
                time: k.time ?? 0, x: k.x ?? 50, y: k.y ?? 50, zoom: k.zoom ?? 1,
                type: k.type ?? 'circle', effect: k.effect ?? 'none', color: k.color ?? '#ffd700',
                alpha: k.alpha ?? 1, thickness: k.thickness ?? 2, vSize: k.vSize ?? 1.5,
                easing: k.easing ?? 'linear', points: Array.isArray(k.points) ? k.points : []
            })).sort((a, b) => a.time - b.time);
            selectedIdx = activeKeyframes.length > 0 ? 0 : -1;
            if (selectedIdx !== -1) Object.keys(propUI).forEach(k => propUI[k].value = activeKeyframes[0][k]);
            render();
        }

        document.getElementById('load-default-json').onclick = async () => {
            try {
                const res = await fetch('annotations.json');
                if (!res.ok) return alert('Could not load annotations.json');
                loadAnnotationsData(await res.json());
            } catch (e) { alert('Error loading annotations.json'); }
        };

        const importInput = document.getElementById('import-file');
        document.getElementById('import-json').onclick = () => importInput.click();
        importInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try { loadAnnotationsData(JSON.parse(await file.text())); }
            catch (err) { alert('Invalid JSON file'); }
            importInput.value = '';
        };

        document.getElementById('export-json').onclick = () => {
            if (activeKeyframes.length === 0) return alert("Add keyframes!");
            const blob = new Blob([JSON.stringify([{ keyframes: activeKeyframes }], null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'annotations.json'; a.click();
        };
    </script>
</body>
</html>
